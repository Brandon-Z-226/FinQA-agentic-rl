# Derived from the pinned rLLM FinQA train_verl.sh (Apache-2.0).
# Single A800 adaptation; upstream/finqa/train_verl.sh remains unchanged.
hydra:
  run:
    dir: ${oc.env:FINQA_GPU_ROOT}/outputs/${trainer.experiment_name}/${now:%Y-%m-%d_%H-%M-%S}

model:
  name: ${actor_rollout_ref.model.path}

data:
  train_batch_size: 16
  val_batch_size: 8
  max_prompt_length: 8192
  max_response_length: 4096

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

rllm:
  backend: verl
  data:
    train_batch_size: ${data.train_batch_size}
    val_batch_size: ${data.val_batch_size}
    max_prompt_length: ${data.max_prompt_length}
    max_response_length: ${data.max_response_length}
    seed: 0
  algorithm:
    use_rllm: true
    kl_beta: 0.0
    adv_estimator: ${algorithm.adv_estimator}
    norm_adv_by_std_in_grpo: ${algorithm.norm_adv_by_std_in_grpo}
    loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
    eps_clip: ${actor_rollout_ref.actor.clip_ratio_low}
    eps_clip_high: ${actor_rollout_ref.actor.clip_ratio_high}
  rollout:
    n: ${actor_rollout_ref.rollout.n}
    n_val: ${actor_rollout_ref.rollout.val_kwargs.n}
    train:
      temperature: ${actor_rollout_ref.rollout.temperature}
    val:
      temperature: ${actor_rollout_ref.rollout.val_kwargs.temperature}
  trainer:
    total_epochs: ${trainer.total_epochs}
    save_freq: ${trainer.save_freq}
    test_freq: ${trainer.test_freq}
    val_before_train: ${trainer.val_before_train}
    logger: ${trainer.logger}
    project_name: ${trainer.project_name}
    experiment_name: ${trainer.experiment_name}
  gateway:
    renderer_family: qwen3
  workflow:
    n_parallel_tasks: 8
  async_training:
    enable: false

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:FINQA_MODEL_PATH}
    lora_rank: 32
    lora_alpha: 32
    target_modules: all-linear
    lora:
      rank: 32
      alpha: 32
      merge: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 64
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 16384
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      model_dtype: fp32
      dtype: bfloat16
      ulysses_sequence_parallel_size: 1
    use_kl_loss: false
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    checkpoint:
      save_contents: [model, optimizer, extra]
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        tool_call_parser: hermes
    enforce_eager: true
    free_cache_engine: true
    max_model_len: 16384
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.5
    temperature: 0.6
    n: 4
    val_kwargs:
      n: 1
      temperature: 0.6
      do_sample: true
  ref:
    log_prob_micro_batch_size_per_gpu: 1

trainer:
  logger: [console, ui]
  project_name: finqa
  experiment_name: qwen3-4b-a800-lora32
  val_before_train: false
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 100
  test_freq: 20
  total_epochs: 1
  default_hdfs_dir: null
  default_local_dir: ${oc.env:FINQA_GPU_ROOT}/checkpoints/${trainer.experiment_name}
  max_actor_ckpt_to_keep: 1
  resume_mode: disable

rollout:
  nnodes: 1
  n_gpus_per_node: 1

finqa:
  resource_profile: a800_80gb
  train_limit: null
  val_limit: null
  min_free_disk_gib: 24
