defaults:
  - rllm: base
  - rllm/backend: verl
  - a800_common
  - _self_

hydra:
  searchpath:
    - pkg://rllm.trainer.config
    - pkg://verl.trainer.config

data:
  train_batch_size: 2
  val_batch_size: 2
actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 2
trainer:
  experiment_name: qwen3-4b-a800-smoke
  total_training_steps: 1
  save_freq: 1
  test_freq: -1
rllm:
  trainer:
    total_batches: 1
finqa:
  train_limit: 2
  val_limit: 2
  expected_checkpoint_step: 1
