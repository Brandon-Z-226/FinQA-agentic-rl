[project]
name = "finqa-cuda-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["finqa-agentic-rl", "rllm[verl]==0.3.0.pre"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["litellm[proxy]==1.83.0", "numpy>=1.26.0", "rich>=14.1.0"]

[tool.uv.sources]
finqa-agentic-rl = { path = "../..", editable = true }
rllm = { git = "https://github.com/rllm-org/rllm.git", rev = "4e828c81680e5a85b638ceedeaf09d1e90109ca8" }
rllm-model-gateway = { git = "https://github.com/rllm-org/rllm.git", rev = "4e828c81680e5a85b638ceedeaf09d1e90109ca8", subdirectory = "rllm-model-gateway" }

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
